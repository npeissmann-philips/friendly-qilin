services:
  db:
    image: pgvector/pgvector:pg16
    container_name: gemini-prompt-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: embeddings_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    depends_on:
      - db
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gemini-prompt-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=embeddings_db
    volumes:
      - ./src:/app/src
      - ./docs:/app/docs
    restart: unless-stopped

volumes:
  pgdata:
